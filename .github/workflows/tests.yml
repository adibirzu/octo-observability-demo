name: tests

# Guards against silent drift in the deploy/observability assets (LAQL saved
# searches, APM saved-query catalog, deploy-script --help/RBAC contracts) and in
# the shop application code. Runs on every PR and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Contract and shop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shop/requirements-dev.txt
      # A few contract tests (tests/test_admin_host_helper.py, test_stress_demo_surface.py)
      # import shop `server` modules + use FastAPI's TestClient, so the contract
      # suite needs the full shop deps (fastapi, httpx, sqlalchemy, opentelemetry, …),
      # not a minimal set.
      - name: Install shop + test deps
        working-directory: shop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: CycloneDX SBOM freshness
        run: python tools/generate_sbom.py --check
      - name: Contract surface suite (deploy + observability asset drift guard)
        env:
          PYTHONPATH: shop
        run: >-
          python -m pytest -q tests/ --ignore=tests/e2e
      # Integration and browser E2E require a separately approved local stack.
      - name: Shop unit + contract tests
        working-directory: shop
        run: >-
          python -m pytest -q tests
          -m "not integration and not e2e"

  crm:
    name: CRM unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crm/requirements-dev.txt
      - name: Install CRM and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: CRM unit tests
        run: python -m pytest -q tests

  visual:
    name: Visual regression (checkout receipt and CRM signal trend)
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shop/package-lock.json
      - name: Install shop E2E dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx --no-install playwright install chromium
      - name: Run deterministic visual regression tests
        run: npx --no-install playwright test -c playwright.visual.config.ts --update-snapshots=none
      - name: Upload visual regression diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diff
          path: shop/test-results/visual/**/*-diff.png
          if-no-files-found: ignore
