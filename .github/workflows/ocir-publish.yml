name: Publish approved demo images to OCIR

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit to build (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: demo-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: demo-registry-publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        role: [shop, crm, java-apm, workflow-gateway]
    env:
      ROLE: ${{ matrix.role }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out the trusted publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - name: Validate the approved source and native runner
        run: |
          test "$(uname -m)" = x86_64
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
      - name: Check out the approved application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require source to be on main
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up the native builder
        uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - name: Select one approved application build
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          role = os.environ["ROLE"]
          manifest = json.loads(Path("source/deploy/cp-pipeline-manifest.json").read_text())
          builds = [x for x in manifest["containerBuilds"] if x["id"] == role]
          assert len(builds) == 1
          item = builds[0]
          # Paths come from the reviewed source manifest, never dispatch inputs.
          root = Path("source").resolve()
          for key in ("context", "dockerfile"):
              path = (root / item[key]).resolve()
              assert path.is_relative_to(root) and path.exists()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("BUILD_CONTEXT=source/" + item["context"] + "\n")
              output.write("BUILD_FILE=source/" + item["dockerfile"] + "\n")
              output.write("LOCAL_IMAGE=candidate-" + role + ":" + os.environ["SOURCE_SHA"] + "\n")
          PY
      - name: Build a local candidate without registry credentials
        uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_FILE }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          provenance: false
      - name: Inventory the candidate
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          version: v0.76.2
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx
          output: image-raw.cdx.json
          cache: "false"
      - name: Scan vulnerabilities
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          version: v0.76.2
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          format: json
          output: image-vulns-raw.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: "false"
      - name: Export the sanitized inventory
        run: |
          mkdir -p public
          python control/tools/public_sbom.py --input image-raw.cdx.json \
            --output public/image.cdx.json --name "$ROLE" --version "$SOURCE_SHA" \
            --vulnerabilities image-vulns-raw.json --summary public/vulnerabilities.json
      - name: Publish the scanned image
        env:
          OCIR_PUBLISH_CONFIG: ${{ secrets.OCIR_PUBLISH_CONFIG }}
          OCIR_PUSH_TOKEN: ${{ secrets.OCIR_PUSH_TOKEN }}
        run: |
          set +x
          umask 077
          private="$(mktemp -d)"
          trap 'rm -rf "$private"' EXIT
          export PUBLISH_PRIVATE_DIR="$private"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["PUBLISH_PRIVATE_DIR"])
          for variable, name in (("OCIR_PUBLISH_CONFIG", "destination.json"), ("OCIR_PUSH_TOKEN", "token")):
              value = os.environ.pop(variable)
              assert value
              path = root / name
              path.write_text(value)
              path.chmod(0o600)
          PY
          unset OCIR_PUBLISH_CONFIG OCIR_PUSH_TOKEN
          python control/tools/publish_ocir_image.py --role "$ROLE" --source-sha "$SOURCE_SHA" \
            --run-tag "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --config-file "$private/destination.json" --token-file "$private/token" \
            --receipt public/receipt.json
      - name: Upload only sanitized inventory and verified digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-image-${{ matrix.role }}
          path: public/
          if-no-files-found: error
